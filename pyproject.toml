[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phx-filters-pydantic"
dynamic = ["version"]
description = "Pydantic integration for Filters"
authors = [{ name = "Phoenix Zerin", email = "phx@phx.nz" }]
requires-python = ">=3.12"
readme = "README.rst"
license = "MIT"

# :see: https://pypi.org/classifiers/
keywords = [
    "data processing",
    "pipeline",
    "pydantic",
    "transformation",
    "validation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Filters",
]
dependencies = [
    "phx-filters>=4.0.0a2,<5",
    "pydantic>=2,<3",
]

[project.entry-points."filters.extensions"]
PydanticModel = "filters_pydantic:PydanticModel"

[project.urls]
Repository = "https://github.com/todofixthis/filters-pydantic"
Documentation = "https://phx-filters-pydantic.readthedocs.io/"
Changelog = "https://github.com/todofixthis/filters-pydantic/releases"
Issues = "https://github.com/todofixthis/filters-pydantic/issues"

[dependency-groups]
# I'm only one person, so to keep from getting overwhelmed, I'm only committing
# to supporting the 3 most recent versions of Python (see
# https://github.com/todofixthis/cookiecutter-py/blob/main/docs/adr/015-propagate-template-changes-with-copier-and-rotate-python-from-agent-sessions.md).
dev = [
    "autohooks>=26,<27",
    "autohooks-plugin-black>=23,<24",
    "autohooks-plugin-mypy>=23,<24",
    "autohooks-plugin-pytest>=23,<24",
    "autohooks-plugin-ruff>=25,<26",
    "mypy>=2,<3",
    "pytest>=9,<10",
    "sphinx>=9,<10",
    "sphinx_rtd_theme>=3.1,<4",
    "tox>=4,<5",
    "tox-uv>=1,<2",
]

# Used by GitHub Actions and ReadTheDocs.
ci = [
    "black>=26,<27",
    "mypy>=2,<3",
    "pytest>=9,<10",
    "ruff>=0.17,<0.18",
    "sphinx>=9,<10",
    "sphinx_rtd_theme>=3.1,<4",
    "tox-uv>=1,<2",
]

[tool.autohooks]
mode = "pythonpath"
pre-commit = [
    "autohooks.plugins.black",
    "autohooks.plugins.mypy",
    "autohooks.plugins.pytest",
    "autohooks.plugins.ruff",
    # Runs a strict, full-reread Sphinx build on staged docs/docstring
    # changes (see
    # https://github.com/todofixthis/cookiecutter-py/blob/main/docs/adr/020-fail-generated-docs-builds-on-sphinx-warnings-in-ci-and-before-commit.md)
    # — removing this leaves a docs warning to CI, a push later.
    "docs_build",
]

[tool.black]
# Explicit, because black otherwise infers every version `requires-python`
# allows, including ones newer than the running interpreter can parse.
target-version = [
    "py314",
    "py313",
    "py312",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/filters_pydantic",
    "LICENCE.txt",
    "docs",
    "test",
]
exclude = ["docs/_build"]

[tool.hatch.build.targets.wheel]
include = ["src/filters_pydantic"]
exclude = ["docs/_build"]

[tool.hatch.build.targets.wheel.sources]
"src/filters_pydantic" = "filters_pydantic"

[tool.hatch.version]
path = "src/filters_pydantic/__init__.py"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff.lint]
# phx-filters' BaseFilter declares `templates` as an instance attribute, so a
# subclass annotating it `ClassVar`, as RUF012 asks, fails mypy's override
# check.
ignore = ["RUF012"]

[tool.tox]
env_list = [
    "py314",
    "py313",
    "py312",
]

[tool.tox.env_run_base]
commands = [
    ["pytest"],
    ["mypy", "src", "test"],
]
runner = "uv-venv-lock-runner"

[tool.uv]
keyring-provider = "subprocess"
# Fix SSL errors when running in Leash containers
system-certs = true
# Resolve only releases at least 3 days old, so a broken or malicious release
# is usually yanked before a lock refresh picks it up (ADR 013 in
# todofixthis/cookiecutter-py). Exempt one package with
# `exclude-newer-package = { <package> = false }`.
exclude-newer = "3 days"
